# Top-level packages of plaid_env (from `mamba env export --from-history`, prefix removed).
# Exact versions of everything: requirements.lock. Step-by-step recipe: docs/design/DSG-001-environment.md.
# The cu126 torch index suits NVIDIA drivers >= 525; change it on machines that need another CUDA build.
name: plaid_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.14.0+cu126
    - torchvision==0.29.0+cu126
    - nvidia-physicsnemo==2.1.1
    - pyplaid==0.1.15
    - datasets==4.8.5
    - fsspec==2026.2.0
    - s3fs==2026.2.0
    - PyYAML==6.0.3
    - matplotlib==3.11.2
    - pytest==9.1.1
    - ruff==0.16.9
