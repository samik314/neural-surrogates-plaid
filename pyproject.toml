[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plaid-surrogates"
version = "0.1.0"
description = "Transolver neural surrogates for nonlinear solid mechanics on the PLAID benchmarks"
authors = [{ name = "Samik Mukhopadhyay" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
# Loose bounds only; the exact environment is requirements.lock (docs/design/DSG-001-environment.md).
# pyplaid is deliberately not listed: only data/convert.py needs it (docs/methods.md §6).
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "torch>=2.10",
    "nvidia-physicsnemo>=2.1,<2.2",
]

[project.urls]
Repository = "https://github.com/samik314/neural-surrogates-plaid"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep ruff from reformatting code snippets in docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
